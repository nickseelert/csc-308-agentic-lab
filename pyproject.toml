[project]
name = "statcast-lab"
version = "0.1.0"
description = "Postseason Statcast analysis that powers the csc-308-agentic-lab site"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.17"]
refresh = ["pybaseball>=2.2.7"]

[tool.setuptools]
packages = ["analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
